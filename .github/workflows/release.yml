name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (leave off to only build and test)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(uv run --no-project python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")
          echo "tag=$tag version=$version"
          test "$tag" = "$version" || { echo "::error::tag $tag does not match version $version"; exit 1; }

      - name: tests
        # every backend except the external engines; those are covered by tests
        # that assert the "disabled" and "not found" paths
        run: uv run --python 3.12 --with sympy --with scipy --with pint --with control --with fastapi --with pydantic --with httpx2 python -m unittest discover -s tests -p "test_*.py" -v

      - name: build
        run: uv build

      - name: check the artefacts
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-latest
    # Trusted Publishing: PyPI verifies this repository/workflow/environment via
    # OIDC. No API token exists anywhere.
    environment:
      name: pypi
      url: https://pypi.org/p/calcbox
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
